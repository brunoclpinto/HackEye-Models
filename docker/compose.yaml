# Explicit project name: without this, Compose derives it from this file's
# containing directory ("docker"), which collides with unrelated projects
# elsewhere on the host also named "docker" (observed directly -- caused a
# spurious "orphan containers" warning against an unrelated postgres/app/
# ollama/qdrant stack).
name: hackeye-models

services:
  train:
    build:
      # This compose file lives in docker/, but the build needs the whole
      # repo (requirements.txt, training/, datasets/) as context, so this
      # points one level up at the repo root. Run `docker compose` from
      # the repo root with `-f docker/compose.yaml`, or `cd docker &&
      # docker compose ...` -- see README.md.
      context: ..
      dockerfile: docker/Dockerfile
    image: hackeye-train
    working_dir: /app
    # Same rationale as the main HackEye repo's RnD/compose.yaml: run as the
    # host user so the thousands of files a conversion/training run writes
    # into the bind mounts don't end up root-owned.
    user: "${UID:-1000}:${GID:-1000}"
    # Docker's 64MB /dev/shm default kills DataLoader workers with a silent
    # "Bus error" once you're actually moving batches through shared memory
    # -- inference here has always been single-process and never hit this.
    shm_size: "8gb"
    environment:
      # With user:${UID}:${GID} and a root-owned $HOME in the base image,
      # Ultralytics falls back to writing its settings/weights cache under
      # /tmp (observed directly: "user config directory '/root/.config/
      # Ultralytics' is not writable"). That evaporates on container exit,
      # silently losing run settings and any auto-downloaded weights
      # (e.g. the yolo26n.pt check_amp() fetches). Point it at the runs
      # mount instead. NOTE: the target directory must exist in the mount
      # before first use (Ultralytics doesn't mkdir -p its full config path)
      # -- see PROGRESS.md's "Crash root cause" section for the one-time fix.
      YOLO_CONFIG_DIR: /runs/ultralytics-cfg
    volumes:
      # Repo root (one level up from this file) mounted at /app, matching
      # the Dockerfile's WORKDIR. Invoke scripts by their path from here,
      # e.g. `training/train_semantic.py`, `datasets/vistas/conversion/vistas_convert.py`.
      - ..:/app
      # Datasets and run outputs live outside the repo, in the shared media
      # dir (~/media/hackeye-models, since 2026-10-18): the repo holds only
      # definition files. Mounted at /datasets and /runs so every script
      # default and documented path keeps working. Override with
      # HACKEYE_DATASETS_DIR / HACKEYE_RUNS_DIR.
      - ${HACKEYE_DATASETS_DIR:-../../../media/hackeye-models/datasets}:/datasets
      - ${HACKEYE_RUNS_DIR:-../../../media/hackeye-models/runs}:/runs
      # The HackEye app's video library (GoPro clips), read-only. It is the
      # source of the HackEye frames dataset (datasets/hackeye/extract_frames.py).
      - ${HACKEYE_MEDIA_DIR:-../../../media/hackeye}:/media-src:ro
      # Downloaded base checkpoints (official Ultralytics yolo26* assets) live
      # in the shared ~/models/ultralytics dir alongside every other base model
      # on this host; only our own HackEye fine-tunes stay in this repo's models/.
      - ${BASE_MODELS_DIR:-../../../models/ultralytics}:/base-models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- Models Lab (lab/PLAN.md). `docker compose up -d lab sam` starts only these two. ----
  lab:
    build:
      context: ..
      dockerfile: lab/Dockerfile
    image: hackeye-models-lab
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      LAB_DATASET: ${LAB_DATASET:-/datasets/HackEye26.1-124}
      LAB_DATASETS_ROOT: ${LAB_DATASETS_ROOT:-/datasets}
      LAB_REPO: /app
      SAM_URL: ${SAM_URL:-http://sam:8000}
    volumes:
      - ..:/app
      - ${HACKEYE_DATASETS_DIR:-../../../media/hackeye-models/datasets}:/datasets
      - ${HACKEYE_RUNS_DIR:-../../../media/hackeye-models/runs}:/runs
    # no depends_on sam: the lab works without it

  sam:
    build:
      context: ../lab/sam
    image: hackeye-models-sam
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment:
      SAM_DATASET: ${SAM_DATASET:-HackEye26.1-124}
      # no passwd entry for the host uid: torch (getpass) wants these, HOME must be writable
      HOME: /tmp
      USER: lab
      LOGNAME: lab
      SAM_IDLE_S: ${SAM_IDLE_S:-600}
    volumes:
      - ${HACKEYE_DATASETS_DIR:-../../../media/hackeye-models/datasets}:/datasets:ro
      - ${MODELS_DIR:-../../../models}/sam2:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
