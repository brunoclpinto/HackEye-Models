<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackEye Models Lab</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <h1>Models Lab</h1>
  <nav id="tabs">
    <a href="#edit" data-tab="edit" data-testid="tab-edit">Edit</a>
    <a href="#taxonomy" data-tab="taxonomy" data-testid="tab-taxonomy">Taxonomy</a>
    <a href="#rules" data-tab="rules" data-testid="tab-rules">Rules</a>
  </nav>
  <span class="grow"></span>
  <button id="helpBtn" title="Keyboard shortcuts (?)">?</button>
</header>

<main id="page">
  <!-- Browse: permanent -->
  <section class="grp" data-gid="browse">
    <header class="gh">
      <button class="gt"><i class="chev"></i><span>Browse</span></button>
      <span id="bCount" class="muted mono" data-testid="frame-count"></span>
      <span class="grow"></span>
      <div class="seg" id="bTags">
        <button data-st="ok" data-testid="tag-ok" title="Tag ok (Shift+1)">ok</button><button data-st="fix" data-testid="tag-fix" title="Tag fix (Shift+2)">fix</button>
        <button data-st="drop" data-testid="tag-drop" title="Tag drop (Shift+3)">drop</button><button data-st="todo" data-testid="tag-todo" title="Tag todo (Shift+4)">todo</button>
      </div>
      <div class="seg">
        <button id="bPrev" data-testid="nav-prev" title="Previous frame (Left / P); wraps from the first to the last">&larr;<span class="lbl"> Prev</span></button>
        <span id="bPos" class="pos mono" data-testid="nav-pos" data-index="0" data-total="0"></span>
        <button id="bNext" data-testid="nav-next" title="Next frame (Right / N); wraps from the last to the first"><span class="lbl">Next </span>&rarr;</button>
      </div>
    </header>
    <div class="gb">
      <form id="bFilter" class="bar" autocomplete="off">
        <label>Split <select name="split" data-testid="filter-split"><option value="">all</option><option>train</option><option>val</option></select></label>
        <label>Clip <select name="clip" data-testid="filter-clip"><option value="">all</option></select></label>
        <label>Status <select name="status" data-testid="filter-status"><option value="">any</option><option>todo</option><option>ok</option><option>fix</option><option>drop</option><option>edited</option></select></label>
        <label>Conf <input name="cmin" type="number" step="0.01" min="0" max="1" placeholder="min"><input name="cmax" type="number" step="0.01" min="0" max="1" placeholder="max"></label>
        <label>Low <input name="lmin" type="number" step="0.01" min="0" max="1" placeholder="min"><input name="lmax" type="number" step="0.01" min="0" max="1" placeholder="max"></label>
        <label>Class <select name="cls" data-testid="filter-class"><option value="">any</option></select></label>
        <label>Min px <input name="minpx" type="number" step="100" min="0" placeholder="2000"></label>
        <label>Edited <select name="edited"><option value="">any</option><option value="1">yes</option><option value="0">no</option></select></label>
        <label>Sort <select name="sort"><option value="time">time</option><option value="conf">conf asc</option><option value="-conf">conf desc</option><option value="low">lowconf</option><option value="-edited">recently edited</option></select></label>
        <button type="button" id="bReset">Reset</button>
      </form>
    </div>
  </section>

  <!-- Image: editor canvas, visible on every tab -->
  <section class="grp" data-gid="image">
    <header class="gh">
      <button class="gt"><i class="chev"></i><span>Image</span></button>
      <div id="eInfo" class="info"></div>
      <span id="selLabel" class="sel-label mono" data-testid="selection-label" hidden></span>
    </header>
    <div class="gb" id="page-edit" data-testid="editor" data-dirty="false">
      <div id="eStage"><canvas id="eCanvas" data-testid="editor-canvas"></canvas><div id="eLoading" class="loading" hidden>Loading...</div></div>
      <div id="eHandle" class="handle" title="Drag to resize the image"></div>
    </div>
  </section>

  <!-- Work: the selected tab's controls -->
  <section class="grp" data-gid="work">
    <header class="gh"><button class="gt"><i class="chev"></i><span id="workTitle">Work</span></button></header>
    <div class="gb">
      <div class="pane" id="pane-edit">
        <div class="cols2">
          <section class="grp sub wide" data-gid="edit-classes">
            <header class="gh"><button class="gt"><i class="chev"></i><span>Classes</span></button></header>
            <div class="gb"><div id="ePicker"></div></div>
          </section>
          <div class="stack">
            <section class="grp sub" data-gid="edit-tools">
              <header class="gh"><button class="gt"><i class="chev"></i><span>Tools</span></button></header>
              <div class="gb tools">
                <div class="seg" id="eTools">
                  <button data-testid="tool-inspect" data-tool="inspect" title="Inspect: click or tap an item to box it (V)">Inspect</button>
                  <button data-testid="tool-brush" data-tool="brush" title="Brush (B)">Brush</button>
                  <button data-testid="tool-erase" data-tool="erase" title="Erase to secondary class (E)">Erase</button>
                  <button data-testid="tool-region" data-tool="region" title="Region relabel (R)">Region</button>
                  <button data-testid="tool-polygon" data-tool="polygon" title="Polygon / lasso (L)">Lasso</button>
                  <button data-testid="tool-sam" data-tool="sam" title="SAM2 (S)">SAM</button>
                </div>
                <label title="Brush size ([ and ])">Size <input id="eSize" data-testid="brush-size" type="range" min="1" max="64" value="8"><b id="eSizeV" class="mono">8</b></label>
                <select id="eShape" data-testid="brush-shape" title="Round / square (Q)"><option value="round">Round</option><option value="square">Square</option></select>
                <button id="eSamNeg" data-testid="sam-negative" title="SAM: make the next taps negative points (touch has no right-click)">&minus; point</button>
                <span id="eSamInfo" class="muted mono"></span>
              </div>
            </section>
            <section class="grp sub" data-gid="edit-protect">
              <header class="gh"><button class="gt"><i class="chev"></i><span>Protect</span></button></header>
              <div class="gb"><div id="eProtect"></div></div>
            </section>
            <section class="grp sub" data-gid="edit-view">
              <header class="gh"><button class="gt"><i class="chev"></i><span>View</span></button></header>
              <div class="gb tools">
                <label title="Overlay opacity">Opacity <input id="eOpacity" type="range" min="0" max="100" value="55"></label>
                <button id="eMask" title="Toggle mask (M)">Mask</button>
                <button id="eOutline" title="Outline mode (O)">Outline</button>
                <button id="eGrid" title="Pixel grid (G), shown from 8x">Grid</button>
                <label>View map <select id="eMap"><option value="">none</option></select></label>
                <button id="eFit" title="Fit (F)">Fit</button>
                <button id="e11" title="Actual pixels (0)">1:1</button>
              </div>
            </section>
            <section class="grp sub" data-gid="edit-frame">
              <header class="gh"><button class="gt"><i class="chev"></i><span>Frame</span></button></header>
              <div class="gb tools">
                <div class="seg" id="eStatus">
                  <button data-st="ok">ok</button><button data-st="fix">fix</button><button data-st="drop">drop</button><button data-st="todo">todo</button>
                </div>
                <input id="eNote" type="text" placeholder="note" size="24">
                <button id="eUndo" title="Undo (Ctrl+Z)">Undo</button>
                <button id="eRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
                <button id="eSave" class="primary" data-testid="btn-save" title="Save (Ctrl+S)">Save</button>
                <button id="eRevert" data-testid="btn-revert" title="Revert to original">Revert</button>
                <button id="ePrev" title="Previous (P)">&larr; P</button><button id="eNext" title="Next (N)">N &rarr;</button>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="pane" id="pane-taxonomy" hidden>
        <div class="cols2">
          <section class="grp sub wide" data-gid="tax-classes">
            <header class="gh"><button class="gt"><i class="chev"></i><span>Classes</span></button></header>
            <div class="gb">
              <div class="bar">
                <input id="tFilter" type="search" placeholder="Filter classes" autocomplete="off">
                <button id="tNew" data-testid="btn-new-class">New class</button>
                <button id="tSplit" data-testid="btn-split">Split</button>
                <button id="tEdit" data-testid="btn-edit-class">Edit</button>
                <button id="tDelete" data-testid="btn-delete-class">Delete</button>
                <span class="grow"></span>
                <button id="tVoid" title="Move checked classes under __ignore__">Void checked</button>
                <button id="tMerge" class="primary" data-testid="btn-merge" title="Merge checked classes / selected groups">Merge</button>
              </div>
              <div id="tTable" class="scroll"></div>
            </div>
          </section>
          <div class="stack">
            <section class="grp sub" data-gid="tax-map">
              <header class="gh"><button class="gt"><i class="chev"></i><span>Map builder</span></button><span class="grow"></span><span class="muted mono">N =</span> <b id="tN" data-testid="preview-n" class="mono"></b></header>
              <div class="gb">
                <div class="bar">
                  <label>Map <select id="tMapSel" data-testid="map-load"><option value="">(choose)</option></select></label>
                  <button id="tLoad">Load</button>
                  <button id="tIdentity">Identity</button>
                  <span class="muted">The image shows this map (view-through-map).</span>
                </div>
                <div id="tGroups" class="scroll"></div>
              </div>
            </section>
            <section class="grp sub" data-gid="tax-save">
              <header class="gh"><button class="gt"><i class="chev"></i><span>Save / export</span></button></header>
              <div class="gb">
                <div class="bar wrap">
                  <input id="tName" data-testid="map-name" type="text" autocomplete="off" spellcheck="false" size="34">
                  <button id="tSaveMap" data-testid="btn-save-map">Save map</button>
                  <button id="tExport" class="primary" data-testid="btn-export">Save as new dataset</button>
                </div>
                <div id="tJob" data-testid="job-status" class="job" hidden></div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="pane" id="pane-rules" hidden>
        <div class="cols2">
          <section class="grp sub" data-gid="rules-rule">
            <header class="gh"><button class="gt"><i class="chev"></i><span>Rule</span></button></header>
            <div class="gb form">
              <p class="hint">Relabel every pixel of one class to another across the filtered frames. Dry run first.</p>
              <div class="two"><label>From class <select id="rFrom" data-testid="rule-from"></select></label><label>To class <select id="rTo" data-testid="rule-to"></select></label></div>
              <div class="two"><label>Split <select id="rSplit"><option value="">all</option><option>train</option><option>val</option></select></label>
                <label>Clip <select id="rClip"><option value="">all</option></select></label></div>
              <label>Only these stems (optional, whitespace or comma separated) <textarea id="rStems" rows="2"></textarea></label>
              <div class="row"><button id="rDry" data-testid="btn-dry-run">Dry run</button></div>
            </div>
          </section>
          <section class="grp sub wide" data-gid="rules-result">
            <header class="gh"><button class="gt"><i class="chev"></i><span>Result</span></button></header>
            <div class="gb">
              <div id="rResult"><p class="hint">Run a dry run to see the counts and sample frames. Click a sample to open it in the image above.</p></div>
              <div class="row"><button id="rApply" class="primary" disabled>Apply</button></div>
              <div id="rJob" class="job" hidden></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="status" class="mono">
  <span id="sb-version"></span><span id="sb-dataset"></span><span id="sb-sam" data-testid="sam-status"></span>
  <span class="grow"></span>
  <span id="sb-tool"></span><span id="sb-zoom"></span><span id="sb-cursor" data-testid="readout"></span>
</footer>

<div id="help" hidden><div class="card help-card"></div></div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
